{% extends "base.html" %}
{% block title %}茵蒂克丝.skill - 知识库{% endblock %}

{% block nav_extra %}
<div class="ms-auto">
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-light btn-sm active" id="btn-vault-tab" onclick="switchPanel('vault')">
            <i class="bi bi-journal-text me-1"></i>笔记库
        </button>
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-input-tab" onclick="switchPanel('input')">
            <i class="bi bi-plus-circle me-1"></i>新建笔记
        </button>
    </div>
</div>
{% endblock %}

{% block content %}
<!-- Vault Panel -->
<div id="panel-vault">
    <!-- Type filters -->
    <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
        <span class="text-muted small me-2">筛选：</span>
        <button class="btn btn-sm filter-btn active" data-filter="all" onclick="filterNotes('all')">全部</button>
        <button class="btn btn-sm filter-btn" data-filter="idea" onclick="filterNotes('idea')">
            <span class="badge-dot badge-dot-idea"></span>想法
        </button>
        <button class="btn btn-sm filter-btn" data-filter="project" onclick="filterNotes('project')">
            <span class="badge-dot badge-dot-project"></span>项目
        </button>
        <button class="btn btn-sm filter-btn" data-filter="book" onclick="filterNotes('book')">
            <span class="badge-dot badge-dot-book"></span>书籍
        </button>
        <button class="btn btn-sm filter-btn" data-filter="paper" onclick="filterNotes('paper')">
            <span class="badge-dot badge-dot-paper"></span>论文
        </button>
        <button class="btn btn-sm filter-btn" data-filter="webinfo" onclick="filterNotes('webinfo')">
            <span class="badge-dot badge-dot-webinfo"></span>网页
        </button>
        <button class="btn btn-sm filter-btn" data-filter="webnews" onclick="filterNotes('webnews')">
            <span class="badge-dot badge-dot-webnews"></span>新闻
        </button>
    </div>

    <!-- Note cards -->
    <div id="notes-list" class="row g-3">
        <div class="col-12 text-center py-5 text-muted" id="notes-loading">
            <div class="spinner-border spinner-border-sm me-2"></div>加载中...
        </div>
    </div>

    <div id="notes-empty" class="text-center py-5 d-none">
        <i class="bi bi-journal-x" style="font-size: 3rem; color: #ccc;"></i>
        <p class="text-muted mt-3">暂无笔记，点击右上角"新建笔记"开始整理知识</p>
    </div>
</div>

<!-- Input Panel -->
<div id="panel-input" class="d-none">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-4"><i class="bi bi-plus-circle me-2"></i>录入新信息</h4>

                    <!-- Input type tabs -->
                    <ul class="nav nav-tabs mb-3" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-text" onclick="setInputType('text')">
                                <i class="bi bi-chat-text me-1"></i>文本输入
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-file" onclick="setInputType('file')">
                                <i class="bi bi-file-earmark-arrow-up me-1"></i>文件上传
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-url" onclick="setInputType('url')">
                                <i class="bi bi-link-45deg me-1"></i>网页URL
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Text Tab -->
                        <div class="tab-pane fade show active" id="tab-text">
                            <textarea class="form-control" id="input-text" rows="6" placeholder="输入您的想法、笔记内容、arXiv ID 等..."></textarea>
                        </div>

                        <!-- File Tab -->
                        <div class="tab-pane fade" id="tab-file">
                            <div class="upload-zone" id="upload-zone">
                                <i class="bi bi-cloud-arrow-up" style="font-size: 2rem; color: #6c757d;"></i>
                                <p class="mt-2 mb-1">拖拽文件到此处，或点击选择文件</p>
                                <small class="text-muted">支持 PDF, DOCX, TXT, EPUB 等格式</small>
                                <input type="file" id="input-file" class="d-none" accept=".pdf,.docx,.doc,.txt,.epub,.mobi,.rtf">
                            </div>
                            <div id="file-info" class="d-none mt-2 p-2 bg-light rounded">
                                <i class="bi bi-file-earmark me-1"></i>
                                <span id="file-name"></span>
                                <button class="btn btn-sm btn-link text-danger float-end" onclick="clearFile()">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </div>
                        </div>

                        <!-- URL Tab -->
                        <div class="tab-pane fade" id="tab-url">
                            <input type="url" class="form-control form-control-lg" id="input-url" placeholder="https://arxiv.org/abs/2505.00949">
                            <small class="text-muted">支持 arXiv、GitHub、新闻网站及任意网页 URL</small>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button class="btn btn-primary btn-lg" id="btn-process" onclick="startProcessing()">
                            <i class="bi bi-magic me-2"></i>开始整理
                        </button>
                    </div>

                    <!-- Processing status -->
                    <div id="processing-status" class="d-none mt-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title mb-3">
                                    <i class="bi bi-list-check me-2"></i>处理进度
                                </h6>
                                <ul id="processing-steps" class="pipeline-steps list-unstyled mb-3"></ul>
                                <div id="processing-result" class="d-none text-center pt-2 border-top">
                                    <a id="processing-link" href="#" class="btn btn-success">
                                        <i class="bi bi-journal-check me-1"></i>查看新笔记
                                    </a>
                                </div>
                                <div id="processing-error-box" class="d-none pt-2 border-top">
                                    <p class="text-danger mb-0"><i class="bi bi-exclamation-circle me-1"></i><span id="processing-error"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
