{% extends "base.html" %}
{% block title %}茵蒂克丝.skill - 笔记详情{% endblock %}

{% block body %}
<div class="detail-page">
    <div class="detail-topbar">
        <a href="/app" class="detail-back">
            <i class="bi bi-arrow-left"></i> 返回
        </a>
        <div class="detail-actions" id="detail-actions"></div>
    </div>

    <div class="detail-container">
        <div id="note-loading" class="loading-state">
            <div class="spinner-border"></div>
            <p>加载笔记中...</p>
        </div>
        <div id="note-error" class="d-none error-state">
            <i class="bi bi-exclamation-circle"></i>
            <p>笔记加载失败</p>
        </div>
        <div id="note-content" class="d-none">
            <div class="note-meta-bar">
                <span class="badge note-type-badge" id="note-type-badge"></span>
                <span class="note-date" id="note-date"></span>
                <span class="note-tags" id="note-tags"></span>
                <span class="note-source-badge" id="note-source-badge"></span>
            </div>
            <h1 id="note-title" class="note-detail-title"></h1>
            <div id="note-body" class="obsidian-content"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const noteSource = "{{ source }}";
    const noteFilename = "{{ filename }}";
    document.addEventListener('DOMContentLoaded', () => loadNoteDetail(noteSource, noteFilename));
</script>
{% endblock %}
